name: zurai02 Platform CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  LUAZI_VERSION: 2.0.0
  NODE_VERSION: 20

jobs:
  # ============================================
  # Build & Test
  # ============================================
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install Luazi Compiler
      run: |
        npm install -g luazi@${{ env.LUAZI_VERSION }}
        luazi --version

    - name: Install dependencies
      run: npm ci

    - name: Lint Luazi source files
      run: |
        luazi lint backend/server.lz
        luazi lint scripts/*.lz

    - name: Type check
      run: luazi typecheck backend/server.lz

    - name: Build backend to bytecode
      run: |
        luazi build backend/server.lz -t bytecode -o dist/server.lzc
        luazi build scripts/*.lz -t bytecode -o dist/scripts/

    - name: Build backend to WebAssembly
      run: |
        luazi build backend/server.lz -t wat -o dist/server.wat
        wat2wasm dist/server.wat -o dist/server.wasm

    - name: Build backend to C++
      run: luazi build backend/server.lz -t cpp -o dist/server.cpp

    - name: Build backend to C#
      run: luazi build backend/server.lz -t csharp -o dist/server.cs

    - name: Run tests
      run: luazi test

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifacts
        path: |
          dist/
          !dist/**/*.map

  # ============================================
  # Security Scan
  # ============================================
  security:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Luazi security audit
      run: luazi audit --severity high

    - name: Check for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: ${{ github.event.repository.default_branch }}
        head: HEAD
        extra_args: --debug --only-verified

  # ============================================
  # Deploy to GitHub Pages
  # ============================================
  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload frontend artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: |
          index.html
          privacy.html
          tos.html
          redirect.html
          styles.css
          app.js
          scripts/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ============================================
  # Deploy Backend (if self-hosted)
  # ============================================
  deploy-backend:
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: build-artifacts
        path: dist/

    - name: Deploy backend
      run: |
        echo "Deploying zurai02 backend..."
        # Add your deployment commands here
        # Example: scp, rsync, or API call to your server

    - name: Notify deployment
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'zurai02 backend deployed successfully!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
